# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX package structure
android.useAndroidX=true
android.gradlePluginVersion=8.3.2

# React Native architecture settings
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Enable New Architecture (required by react-native-reanimated)
newArchEnabled=true

# Enable Hermes JS engine
hermesEnabled=true

# Edge-to-edge display support
edgeToEdgeEnabled=false
ndkVersion=27.1.12297006

# Keystore configuration
OTTER_UPLOAD_STORE_FILE=otter.jks
OTTER_UPLOAD_KEY_ALIAS=otter
OTTER_UPLOAD_STORE_PASSWORD=Rocky#2002
OTTER_UPLOAD_KEY_PASSWORD=Elephant@2002