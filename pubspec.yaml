name: lyket
description: "Lyket — Premium AI-powered social discovery platform"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Typography
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.69.0

  # Animations
  flutter_animate: ^4.5.2

  # Loading effects
  shimmer: ^3.0.0

  # Image handling
  image_picker: ^1.1.2

  # SVG support
  flutter_svg: ^2.0.17

  # Cached images
  cached_network_image: ^3.4.1

  # Page indicators
  smooth_page_indicator: ^1.2.0+3
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.5.5
  timeago: ^3.7.1
  http: ^1.6.0
  socket_io_client: ^3.1.4
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  visibility_detector: ^0.4.0+2
  http_parser: ^4.1.2
  share_plus: ^12.0.2
  flutter_secure_storage: ^10.3.1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  google_sign_in: ^6.2.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_local_notifications: ^22.0.0
  intl: ^0.20.2
  file_picker: ^11.0.2
  shorebird_code_push: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
